<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sarita ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:black;
color:white;
overflow:hidden;
height:100vh;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-10;
}

/* 🎬 PAGE */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:1s ease;
padding:20px;
}

.page.active{
opacity:1;
pointer-events:auto;
}

/* 🎬 TITLE */
.title{
font-size:38px;
margin-bottom:15px;
text-shadow:0 0 20px #ff4d6d;
}

/* 🔘 BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
margin-top:15px;
cursor:pointer;
}

/* 💬 CHAT */
#chatBox{
width:90%;
max-width:500px;
height:380px;
overflow-y:auto;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:20px;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#222;
color:white;
margin-top:10px;
}

/* 💌 BOX */
.specialBox{
width:300px;
height:200px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* 📸 GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
width:90%;
max-width:900px;
}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

/* 🎆 FINAL */
.finalGlow{
font-size:42px;
text-shadow:0 0 10px #fff,0 0 20px #ff4d6d;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🔊 AUDIO -->
<audio id="a1" src="audio_1.mp3"></audio>
<audio id="a2" src="audio_2.mp3"></audio>
<audio id="a3" src="audio_3.mp3"></audio>
<audio id="a4" src="audio_4.mp3"></audio>
<audio id="a5" src="audio_5.mp3"></audio>
<audio id="a6" src="audio_6.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<h1 class="title">💬 Chat With Musa</h1>

<div id="chatBox">

<div class="msg me">Hi mero musa ❤️</div>

<div id="chatArea"></div>

<input id="r1" placeholder="Type reply..." onkeydown="chatFlow(event)">

</div>

<button id="startBtn" onclick="go(2)" style="display:none;">
🎬 Start Surprise
</button>

</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1 class="title">💌 Special Message</h1>

<div class="specialBox" onclick="openSpecial()">
<h3>HBD GIRL ❤️</h3>
<p>Click to open</p>
</div>

<button onclick="go(3)">Next</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1 class="title">🎮 What I Love</h1>

<button onclick="love(1)">1</button>
<button onclick="love(2)">2</button>
<button onclick="love(3)">3</button>

<p id="loveOut"></p>

<button onclick="go(4)">Next</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1 class="title">📸 Memories</h1>

<div class="gallery">
<img src="us.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
</div>

<button onclick="go(5)">Next</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">

<h1 class="title">💌 Thank You</h1>

<button onclick="thank()">Reveal</button>

<p id="thankOut"></p>

<button onclick="go(6)">Next</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">

<h1 class="title">🎥 Video</h1>

<video controls width="300">
<source src="Video.MOV">
</video>

<button onclick="go(7)">Final</button>
</div>

<!-- PAGE 7 -->
<div class="page" id="p7">

<div class="finalGlow">
🎉 HAPPY BIRTHDAY SARITA ❤️
</div>

<p>Forever My Best Friend 🫶</p>

</div>

<script>

let step = 0;
let currentAudio = null;

/* 🔊 AUDIO FIX */
function stopAll(){
if(currentAudio){
currentAudio.pause();
currentAudio.currentTime = 0;
}
}

function playAudio(n){
stopAll();
let a = document.getElementById("a"+n);
if(a){
currentAudio = a;
a.play().catch(()=>{});
}
}

/* 🎬 PAGE SWITCH */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

if(p >= 2 && p <= 6){
playAudio(p-1);
}

}

/* 💬 CHAT FLOW (FIXED EXACT STORY) */
function chatFlow(e){

if(e.key !== "Enter") return;

let val = document.getElementById("r1").value.trim();
if(val === "") return;

let chat = document.getElementById("chatArea");

/* user msg */
chat.innerHTML += `<div class="msg her">${val}</div>`;

/* STORY */
if(step === 0){
chat.innerHTML += `<div class="msg me">Happy Birthday Musa 🎉❤️</div>`;
}

else if(step === 1){
chat.innerHTML += `<div class="msg me">Thank you 🫶</div>`;
}

else if(step === 2){
chat.innerHTML += `<div class="msg me">I tried this to celebrate your birthday 🎬❤️</div>`;
}

else if(step === 3){
chat.innerHTML += `<div class="msg me">Are you ready? 🫶</div>`;
document.getElementById("startBtn").style.display="block";
}

step++;

document.getElementById("r1").value="";
chat.scrollTop = chat.scrollHeight;
}

/* 💌 SPECIAL */
function openSpecial(){
alert("You are my safe place ❤️");
}

/* 🎮 LOVE */
function love(n){
let arr=["Beautiful","Kind","Funny"];
document.getElementById("loveOut").innerText = arr[n-1];
}

/* 💌 THANK YOU */
let t=0;
let thanks=[
"Thank you ❤️",
"Thank you 🌈",
"Thank you 🫶"
];

function thank(){
document.getElementById("thankOut").innerText = thanks[t];
t=(t+1)%thanks.length;
}

</script>

</body>
</html>
