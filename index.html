<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Best Friend ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
overflow:hidden;
color:white;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a0020,#000);
z-index:-3;
}

/* 🎬 INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 4s forwards;
animation-delay:2.5s;
}

#intro h1{
color:#ff4d6d;
font-size:38px;
text-shadow:0 0 20px #ff4d6d;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* 📄 PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.8s;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* 🔘 BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

/* 💖 TITLE */
.glow{
font-size:38px;
text-shadow:0 0 25px #ff4d6d;
}

/* 📸 GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
max-width:90%;
}

.gallery img{
width:100%;
height:90px;
object-fit:cover;
border-radius:10px;
}

/* 🎮 GAME */
.game{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:10px;
}

.game button{
padding:10px;
border-radius:8px;
}

/* 🎥 VIDEO */
video{
width:300px;
border-radius:12px;
margin-top:10px;
}

/* 🎆 CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}

/* 🫶 FINAL */
.hug{
font-size:60px;
animation:beat 1.2s infinite;
}

@keyframes beat{
50%{transform:scale(1.2);}
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎬 INTRO -->
<div id="intro">
<h1>NETFLIX PRESENTS</h1>
<p>🎬 A Best Friend Birthday Story</p>
</div>

<!-- 🎵 AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="glow">🎉 HAPPY BIRTHDAY MY BEST FRIEND ❤️</div>
<button onclick="go(2)">Next ➜</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h2>💌 A Special Message</h2>
<p>You are my safe place, my happiness, my family ❤️</p>
<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">
<h2>🎮 What I Love About You</h2>

<div class="game">
<button onclick="show(1)">1</button>
<button onclick="show(2)">2</button>
<button onclick="show(3)">3</button>
<button onclick="show(4)">4</button>
<button onclick="show(5)">5</button>
<button onclick="show(6)">6</button>
<button onclick="show(7)">7</button>
<button onclick="show(8)">8</button>
<button onclick="show(9)">9</button>
<button onclick="show(10)">10</button>
</div>

<p id="msg"></p>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 PHOTOS -->
<div class="page" id="p4">
<h2>📸 Our Memories</h2>

<div class="gallery">
<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
</div>

<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 VIDEO -->
<div class="page" id="p5">
<h2>🎥 Our Video Memory</h2>

<video controls>
<source src="Video.MOV" type="video/mp4">
</video>

<button onclick="go(6)">Next ➜</button>
</div>

<!-- PAGE 6 FINAL -->
<div class="page" id="p6">
<div class="glow">❤️ HAPPY BIRTHDAY SARITA ❤️</div>
<div class="hug">🫶💞🫶</div>

<button onclick="final()">Finish 🎆</button>
</div>

<script>

/* 🔊 AUDIO FIX (IMPORTANT) */
let audios=["a1","a2","a3","a4","a5","a6"];

function stopAllAudio(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

/* 🎬 PAGE CONTROL */
function go(p){

stopAllAudio(); // 🔥 ALWAYS STOP FIRST

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* play correct audio */
let index=p-2;
if(index>=0 && index<audios.length){
let a=document.getElementById(audios[index]);
if(a){
a.play().catch(()=>{});
}
}
}

/* 🎮 GAME */
let msgs=[
"Your smile is everything 😊",
"You are kind hearted 💖",
"You always support me 🫶",
"You are strong 💪",
"You are beautiful inside out 🌸",
"You are my safe place ❤️",
"You are loyal 💛",
"You make life better 🌈",
"You are unforgettable ✨",
"You are my best friend forever ❤️"
];

function show(n){
document.getElementById("msg").innerText=msgs[n-1];
}

/* 🎆 FINAL */
function final(){

for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff4d6d","#fff","#ffd700"][Math.floor(Math.random()*3)];
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}

document.body.style.filter="brightness(1.2)";
}

</script>

</body>
</html>
