<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Best Friend ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:black;
color:white;
overflow:hidden;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-10;
}

/* 🎬 PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:1s ease;
padding:20px;
}

.page.active{
opacity:1;
pointer-events:auto;
}

/* 🎬 TITLE */
.title{
font-size:32px;
margin-bottom:15px;
text-shadow:0 0 20px #ff4d6d;
}

/* 🔘 BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
margin-top:15px;
cursor:pointer;
}

/* 💬 CHAT */
#chatBox{
width:90%;
max-width:500px;
height:350px;
overflow-y:auto;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:20px;
}

.msg{
margin:10px 0;
padding:10px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
background:#222;
color:white;
}

/* 💌 SPECIAL BOX */
.specialBox{
width:300px;
height:200px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* 💥 MAGIC POP */
.magicPop{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.2);
background:rgba(255,77,109,0.95);
padding:20px;
border-radius:20px;
opacity:0;
transition:0.4s ease;
z-index:9999;
}

.magicPop.show{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}

/* 🎮 LOVE GRID */
.loveGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
width:90%;
max-width:500px;
}

.loveGrid button{
height:55px;
border-radius:15px;
}

/* 💖 LOVE TEXT */
#loveText{
margin-top:15px;
font-size:20px;
padding:12px;
background:rgba(255,255,255,0.08);
border-radius:15px;
}

/* 📸 MEMORY */
.memoryGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
width:90%;
max-width:800px;
}

.memoryGrid img{
width:100%;
height:140px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
}

/* 🎬 CINEMA */
#cinema{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.95);
z-index:9999;
}

#cinemaImg{
width:80%;
height:300px;
background-size:cover;
border-radius:20px;
}

#cinemaText{
margin-top:15px;
font-size:20px;
max-width:80%;
}

/* 🎉 HEARTS */
.heart{
position:fixed;
font-size:18px;
animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
to{transform:translateY(-120vh);opacity:0;}
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- PAGES -->

<div class="page active" id="p1">
<h1 class="title">💬 Chat With Musa</h1>

<div id="chatBox">
<div class="msg me">Hi mero musa ❤️</div>

<div class="msg her">
<input id="r1" placeholder="Type reply..." onkeydown="step1(event)">
</div>
</div>

<button id="startBtn" style="display:none" onclick="go(2)">Start 🎬</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h2 class="title">💌 Special Message</h2>

<div class="specialBox" onclick="openSpecial()">
<h3>Click Me ❤️</h3>
</div>

<button onclick="go(3)">Next 🎬</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">

<h2 class="title">🎮 What I Love</h2>

<div class="loveGrid">
<button onclick="love(1)">1</button>
<button onclick="love(2)">2</button>
<button onclick="love(3)">3</button>
<button onclick="love(4)">4</button>
<button onclick="love(5)">5</button>
<button onclick="love(6)">6</button>
<button onclick="love(7)">7</button>
<button onclick="love(8)">8</button>
<button onclick="love(9)">9</button>
<button onclick="love(10)">10</button>
</div>

<div id="loveText"></div>

<button onclick="go(4)">Next 🎬</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h2 class="title">📸 Memories</h2>

<div class="memoryGrid">

<img src="us.jpeg" onclick="mem('We laughed ❤️','us.jpeg')">
<img src="Bum.JPG" onclick="mem('Safe place 🫶','Bum.JPG')">
<img src="weeeee.JPG" onclick="mem('Chaos 😂','weeeee.JPG')">
<img src="family.JPG" onclick="mem('Family ❤️','family.JPG')">
<img src="happy.jpeg" onclick="mem('Best bond 💖','happy.jpeg')">

</div>

<button onclick="go(5)">Next 🎬</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">

<h2 class="title">💌 Thank You</h2>

<button onclick="thankPop()">Reveal 💥</button>

<button onclick="go(6)">Next 🎬</button>
</div>

<!-- PAGE 6 VIDEO -->
<div class="page" id="p6">

<h2 class="title">🎥 Video Memory</h2>

<video controls playsinline>
<source src="Video.MOV">
</video>

<button onclick="go(7)">Next 🎬</button>
</div>

<!-- FINAL -->
<div class="page" id="p7">
<h1 class="title">🎉 HAPPY BIRTHDAY SARITA ❤️</h1>
<p>Forever best friend 🫶</p>
</div>

<!-- CINEMA -->
<div id="cinema">
<div id="cinemaImg"></div>
<div id="cinemaText"></div>
<button onclick="closeMem()">Close</button>
</div>

<script>

/* NAVIGATION */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

/* CHAT FIX */
function step1(e){
if(e.key==="Enter"){
let val=document.getElementById("r1").value;
if(val.trim()){
document.getElementById("startBtn").style.display="block";
}
}
}

/* SPECIAL MESSAGE */
function openSpecial(){
let msgs=[
"❤️ Safe place",
"🫶 My happiness",
"❤️ My color",
"💖 My everything"
];

msgs.forEach((m,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="magicPop show";
d.innerText=m;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
},i*800);
});
}

/* LOVE */
function love(n){
let arr=[
"Beautiful","Kind","Funny","Strong","Loyal",
"Best","Rare","Caring","Pure","Forever"
];
document.getElementById("loveText").innerText=arr[n-1];
}

/* MEMORY */
function mem(text,img){
document.getElementById("cinema").style.display="flex";
document.getElementById("cinemaImg").style.backgroundImage=`url(${img})`;
document.getElementById("cinemaText").innerText=text;
}

function closeMem(){
document.getElementById("cinema").style.display="none";
}

/* THANK YOU MAGIC */
function thankPop(){
let msgs=[
"Thank you for trusting me ❤️",
"Thank you for colors ❤️",
"Thank you for support 🫶",
"Thank you for calm 🌸",
"Thank you sister-in-law 😂💖"
];

msgs.forEach((m,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="magicPop show";
d.innerText=m;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
},i*700);
});
}

</script>

</body>
</html>
