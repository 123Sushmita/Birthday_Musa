<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sarita ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:black;
overflow:hidden;
color:white;
height:100vh;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:120%;
height:120%;
background:radial-gradient(circle at center,#1a1a1a,#000 70%);
z-index:-10;
}

/* ✨ STARS */
.star{
position:absolute;
background:white;
border-radius:50%;
opacity:.8;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:.3;}
to{opacity:1;}
}

/* 🎬 INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:introFade 4s forwards;
animation-delay:3s;
}

#intro h1{
font-size:70px;
color:#e50914;
letter-spacing:6px;
}

#intro p{
margin-top:10px;
opacity:.8;
font-size:18px;
}

@keyframes introFade{
to{opacity:0;visibility:hidden;}
}

/* 🎥 PAGES */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
text-align:center;
opacity:0;
pointer-events:none;
transform:scale(1.1);
transition:1s ease;
}

.page.active{
opacity:1;
pointer-events:auto;
transform:scale(1);
}

/* 🎬 TITLE */
.title{
font-size:38px;
text-shadow:0 0 25px #ff4d6d;
margin-bottom:20px;
}

/* 🔘 BUTTON */
button{
padding:13px 22px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

/* 💬 CHAT */
#chatBox{
width:90%;
max-width:500px;
height:400px;
overflow-y:auto;
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.msg{
margin:12px 0;
padding:12px 16px;
border-radius:18px;
max-width:75%;
line-height:1.5;
}

.me{
background:#ff4d6d;
margin-left:auto;
text-align:right;
}

.her{
background:#222;
margin-right:auto;
text-align:left;
}

.reply input{
width:100%;
padding:12px;
border:none;
border-radius:15px;
outline:none;
background:#222;
color:white;
}

/* 💌 SPECIAL BOX */
.specialBox{
width:320px;
height:220px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:25px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* 💌 FLOATING */
.floatMsg{
position:absolute;
padding:14px 20px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border-radius:18px;
font-size:18px;
animation:popIn 1s forwards;
}

@keyframes popIn{
from{opacity:0;transform:scale(.3);}
to{opacity:1;transform:scale(1);}
}

/* 🎮 GRID */
.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.grid button{
width:60px;
height:60px;
border-radius:18px;
}

/* 📸 FIXED IMAGE LOOK */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
width:90%;
max-width:900px;
}

.gallery img{
width:100%;
height:170px;
object-fit:cover;
border-radius:14px;
transition:.3s;
box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

.gallery img:hover{
transform:scale(1.05);
}

/* 🎥 VIDEO */
video{
width:320px;
border-radius:15px;
}

/* 💖 HEARTS */
.heart{
position:fixed;
font-size:20px;
animation:floatUp 5s linear forwards;
pointer-events:none;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* 🎆 FINAL */
.finalGlow{
font-size:42px;
text-shadow:0 0 10px #fff,0 0 20px #ff4d6d,0 0 40px #ff4d6d;
}

.output{
margin-top:18px;
font-size:18px;
max-width:700px;
line-height:1.6;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎬 INTRO -->
<div id="intro">
<h1>NETFLIX</h1>
<p>A Pure Story Of Friendship ❤️</p>
</div>

<!-- 🔊 AUDIO (IMPORTANT FIX: USE MP3 FILES) -->
<audio id="a1" src="audio_1.mp3"></audio>
<audio id="a2" src="audio_2.mp3"></audio>
<audio id="a3" src="audio_3.mp3"></audio>
<audio id="a4" src="audio_4.mp3"></audio>
<audio id="a5" src="audio_5.mp3"></audio>
<audio id="a6" src="audio_6.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<h1 class="title">💬 Chat With Musa</h1>

<div id="chatBox">
<div class="msg me">Hi mero musa ❤️</div>

<div class="msg reply">
<input id="r1" placeholder="Type reply..." onkeydown="next1(event)">
</div>
</div>

<button id="startBtn" onclick="go(2)" style="display:none;">🎬 Start</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1 class="title">💌 Special Message</h1>

<div class="specialBox" onclick="openSpecial()">
<h2>🎁 HBD GIRL ❤️</h2>
<p>Click to open</p>
</div>

<div id="floatingMessages"></div>

<button onclick="go(3)">Next</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h2 class="title">🎮 What I Love</h2>

<div class="grid">
<button onclick="love(1)">1</button>
<button onclick="love(2)">2</button>
<button onclick="love(3)">3</button>
<button onclick="love(4)">4</button>
<button onclick="love(5)">5</button>
<button onclick="love(6)">6</button>
<button onclick="love(7)">7</button>
<button onclick="love(8)">8</button>
<button onclick="love(9)">9</button>
<button onclick="love(10)">10</button>
</div>

<div class="output" id="loveOut"></div>

<button onclick="go(4)">Next</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<h2 class="title">📸 Memories</h2>

<div class="gallery">
<img src="us.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="seeee.jpeg">
<img src="Dai.jpg">
<img src="Girls.jpeg">
<img src="family.JPG">
<img src="happy.jpeg">
</div>

<button onclick="go(5)">Next</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
<h2 class="title">💌 Thank You</h2>

<button onclick="nextThank()">Reveal</button>
<div class="output" id="thankOut"></div>

<button onclick="go(6)">Next</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">
<h2 class="title">🎥 Video</h2>

<video controls>
<source src="Video.MOV">
</video>

<button onclick="go(7)">Final</button>
</div>

<!-- PAGE 7 -->
<div class="page" id="p7">
<div class="finalGlow">🎉 HAPPY BIRTHDAY SARITA ❤️</div>
<p class="output">Forever My Best Friend 🫶</p>
</div>

<script>

/* AUDIO FIX (NO OVERLAP) */
function stopAll(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

function playAudio(n){
stopAll();
let a=document.getElementById("a"+n);
if(a) a.play().catch(()=>{});
}

/* PAGE SWITCH */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* AUDIO ONLY 2–6 */
if(p>=2 && p<=6){
playAudio(p-1);
}
}

/* CHAT */
function next1(e){
if(e.key==="Enter"){
document.getElementById("startBtn").style.display="block";
}
}

/* SPECIAL */
function openSpecial(){
let msgs=["Safe ❤️","Family 🫶","Happiness 🌈","Everything 💖"];

msgs.forEach((m,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="floatMsg";
d.innerText=m;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
},i*800);
});
}

/* LOVE */
function love(n){
let arr=["Beautiful","Kind","Funny","Strong","Loyal","Best","Rare","Caring","Pure","Forever"];
document.getElementById("loveOut").innerText=arr[n-1];
}

/* THANK YOU */
let t=0;
let thanks=[
"Thank you for trusting me ❤️",
"Thank you for colors 🌈",
"Thank you for support 🫶",
"Thank you for calm 🌸",
"Thank you sister-in-law 😂💖"
];

function nextThank(){
document.getElementById("thankOut").innerText=thanks[t];
t=(t+1)%thanks.length;
}

</script>

</body>
</html>
