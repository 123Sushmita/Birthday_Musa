<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sarita ❤️</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:black;
color:white;
overflow:hidden;
height:100vh;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-10;
}

/* PAGE */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:1s;
padding:20px;
}

.page.active{
opacity:1;
pointer-events:auto;
}

.title{
font-size:38px;
margin-bottom:15px;
text-shadow:0 0 20px #ff4d6d;
}

/* BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
margin-top:18px;
cursor:pointer;
font-size:16px;
}

/* CHAT */
.chat{
width:90%;
max-width:500px;
height:380px;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:15px;
overflow-y:auto;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#222;
color:white;
margin-top:10px;
}

/* SPECIAL BOX */
.specialBox{
width:300px;
height:200px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
width:90%;
max-width:800px;
}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
}

/* FINAL */
.final{
font-size:42px;
text-shadow:0 0 20px #ff4d6d;
}

.hint{
margin-top:10px;
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎧 AUDIO (1 per page) -->
<audio id="a1" src="audio_1.mp3"></audio>
<audio id="a2" src="audio_2.mp3"></audio>
<audio id="a3" src="audio_3.mp3"></audio>
<audio id="a4" src="audio_4.mp3"></audio>
<audio id="a5" src="audio_5.mp3"></audio>
<audio id="a6" src="audio_6.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<h1 class="title">💬 Chat With Musa</h1>

<div class="chat" id="chat">

<div class="msg me">Hi mero musa ❤️</div>

</div>

<input id="inp" placeholder="Type "hi"" onkeydown="chat(event)">

<div class="hint">Press Enter to continue</div>

</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1 class="title">💌 Special Message</h1>

<div class="specialBox" onclick="go(3)">
<h3>HBD GIRL ❤️</h3>
<p>CLICK TO OPEN</p>
</div>

</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1 class="title">🎮 What I Love</h1>

<button onclick="go(4)">Reveal Memories ▶</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1 class="title">📸 Memories</h1>

<div class="gallery">
<img src="us.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
</div>

<button onclick="go(5)">Next ▶</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">

<h1 class="title">💌 Thank You</h1>

<p id="thanks"></p>

<button onclick="go(6)">Final ▶</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">

<div class="final">🎉 HAPPY BIRTHDAY SARITA ❤️</div>
<p>Forever my best friend 🫶</p>

</div>

<script>

let step = 0;
let currentAudio = null;

/* 🔊 STOP AUDIO */
function stopAll(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime = 0;
});
}

/* 🔊 PLAY AUDIO */
function playAudio(n){
stopAll();
let a = document.getElementById("a"+n);
if(a){
currentAudio = a;
a.play().catch(()=>{});
}
}

/* 🎬 PAGE CHANGE */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* AUDIO FLOW */
if(p >= 1 && p <= 6){
playAudio(p);
}

}

/* 💬 CHAT FLOW */
function chat(e){

if(e.key !== "Enter") return;

let v = inp.value.trim();
if(!v) return;

let chatBox = document.getElementById("chat");

chatBox.innerHTML += `<div class="msg her">${v}</div>`;

if(step === 0){
chatBox.innerHTML += `<div class="msg me">Happy Birthday Musa 🎉❤️</div>`;
}

else if(step === 1){
chatBox.innerHTML += `<div class="msg me">I made something small for you 🫶</div>`;
}

else if(step === 2){
chatBox.innerHTML += `<div class="msg me">Are you ready? ❤️</div>`;
setTimeout(()=>go(2),800);
}

step++;

inp.value="";
chatBox.scrollTop = chatBox.scrollHeight;
}

/* 💌 THANK YOU AUTO */
let t=0;
let msgs=[
"Thank you for trusting me ❤️",
"Thank you for being my happiness 🌈",
"Thank you for always being there 🫶",
"Thank you for staying with me 🌸",
"Thank you for everything 💖"
];

function showThanks(){
let box=document.getElementById("thanks");

let interval=setInterval(()=>{
if(t>=msgs.length){
clearInterval(interval);
return;
}
box.innerHTML+=msgs[t]+"<br>";
t++;
},1200);
}

/* AUTO TRIGGER THANKS */
setTimeout(()=>{
if(document.getElementById("p5").classList.contains("active")){
showThanks();
}
},2000);

</script>

</body>
</html>
