<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Best Friend ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow:hidden;
}

/* 🌌 CINEMATIC BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-5;
}

/* 🎬 PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
transform:scale(1.1);
transition:0.8s ease;
pointer-events:none;
padding:20px;
}

.page.active{
opacity:1;
transform:scale(1);
pointer-events:auto;
}

/* 🔘 BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
margin-top:10px;
cursor:pointer;
}

/* 💖 TITLE */
.glow{
font-size:32px;
text-shadow:0 0 20px #ff4d6d;
}

/* 💌 FLOATING BOXES */
.boxContainer{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.box{
background:#222;
padding:15px;
border-radius:10px;
border:1px solid #ff4d6d;
cursor:pointer;
transition:0.3s;
}

.box:hover{
transform:scale(1.1);
}

/* 📸 MEMORY CARDS */
.memGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
cursor:pointer;
border:1px solid #444;
}

/* 💌 TEXT OUTPUT */
.output{
margin-top:15px;
font-size:16px;
color:#fff;
max-width:300px;
}

/* 🎥 VIDEO */
video{
width:300px;
border-radius:10px;
}

/* 💖 HEARTS */
.heart{
position:fixed;
font-size:18px;
animation:floatUp 5s linear forwards;
}

@keyframes floatUp{
to{transform:translateY(-120vh);opacity:0;}
}

/* 🎬 INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 3s forwards;
animation-delay:2.5s;
}

#intro h1{
color:#e50914;
font-size:50px;
animation:zoom 1.2s ease;
}

@keyframes zoom{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎬 INTRO -->
<div id="intro">
<h1>NETFLIX</h1>
<p>🎬 A Story of Best Friendship ❤️</p>
</div>

<!-- 🔊 AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>

<!-- 🎬 PAGE 1 -->
<div class="page active" id="p1">
<div class="glow">🎉 Happy Birthday My Best Friend ❤️</div>
<button onclick="go(2)">Start Movie 🎬</button>
</div>

<!-- 💌 PAGE 2 MESSAGE -->
<div class="page" id="p2">
<h2>💌 Tap to open messages</h2>

<div class="boxContainer">

<div class="box" onclick="msg('You are my safe place ❤️')">Open</div>
<div class="box" onclick="msg('You bring peace into my life 🫶')">Open</div>
<div class="box" onclick="msg('You are irreplaceable 💖')">Open</div>
<div class="box" onclick="msg('I trust you blindly 🌸')">Open</div>
<div class="box" onclick="msg('You are my happiness 😊')">Open</div>

</div>

<div class="output" id="out"></div>

<button onclick="go(3)">Next 🎬</button>
</div>

<!-- 🎮 PAGE 3 GAME -->
<div class="page" id="p3">
<h2>🎮 What I Love About You</h2>

<div class="boxContainer">
<button onclick="show(1)">1</button>
<button onclick="show(2)">2</button>
<button onclick="show(3)">3</button>
<button onclick="show(4)">4</button>
<button onclick="show(5)">5</button>
<button onclick="show(6)">6</button>
<button onclick="show(7)">7</button>
<button onclick="show(8)">8</button>
<button onclick="show(9)">9</button>
<button onclick="show(10)">10</button>
</div>

<p id="msg"></p>

<button onclick="go(4)">Next</button>
</div>

<!-- 📸 PAGE 4 MEMORIES -->
<div class="page" id="p4">
<h2>📸 Memories</h2>

<div class="memGrid">

<div class="card" onclick="mem('We laughed endlessly 😂❤️')">Memory 1</div>
<div class="card" onclick="mem('We stayed together in hard times 🫶')">Memory 2</div>
<div class="card" onclick="mem('Every moment mattered 🌸')">Memory 3</div>
<div class="card" onclick="mem('You are my safe soul ❤️')">Memory 4</div>

</div>

<p id="memText"></p>

<button onclick="go(5)">Next</button>
</div>

<!-- 💌 PAGE 5 THANK YOU -->
<div class="page" id="p5">
<h2>💌 Thank You</h2>

<button onclick="thank()">Reveal 💖</button>

<p id="thankText"></p>

<button onclick="go(6)">Next</button>
</div>

<!-- 🎥 PAGE 6 VIDEO -->
<div class="page" id="p6">
<h2>🎥 One Last Memory</h2>

<video controls>
<source src="Video.MOV">
</video>

<button onclick="go(7)">Final 🎬</button>
</div>

<!-- 🎉 FINAL -->
<div class="page" id="p7">
<div class="glow">🎉 HAPPY BIRTHDAY SARITA ❤️</div>
<p>Forever my best friend 🫶</p>

<button onclick="final()">End Movie 🎆</button>
</div>

<script>

/* 🔇 AUDIO */
function stopAll(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

/* 🎬 PAGE SWITCH */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

if(p<=5){
stopAll();
let a=document.getElementById("a"+p);
if(a) a.play().catch(()=>{});
}

heart();
}

/* 💌 MESSAGE */
function msg(t){
document.getElementById("out").innerText=t;
}

/* 🎮 GAME */
let love=[
"Beautiful ❤️","Kind 🌸","Funny 😂","Strong 💪","Loyal 💛",
"Peace 🫶","Best 🌈","Support ❤️","Unique ✨","Forever 💖"
];

function show(n){
document.getElementById("msg").innerText=love[n-1];
}

/* 📸 MEMORY */
function mem(t){
document.getElementById("memText").innerText=t;
}

/* 💌 THANK YOU (ONE BY ONE) */
let thanks=[
"Thank you for trusting me blindly ❤️",
"Thank you for adding colors in my life 🌈",
"Thank you for always being there 🫶",
"Thank you for staying calm with me 🌸",
"Thank you for making me your sister-in-law 😂💖"
];

let i=0;
function thank(){
document.getElementById("thankText").innerText=thanks[i];
i++;
if(i>=thanks.length) i=0;
}

/* 💖 HEARTS */
function heart(){
for(let i=0;i<5;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
}
}

/* 🎆 FINAL */
function final(){
for(let i=0;i<100;i++){
let c=document.createElement("div");
c.className="heart";
c.innerHTML=["💖","✨","🎉"][Math.floor(Math.random()*3)];
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),4000);
}
}

</script>

</body>
</html>
