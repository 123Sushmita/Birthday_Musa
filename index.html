<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
overflow:hidden;
}

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;

opacity:0;
pointer-events:none;
transition:0.6s ease;
}

.active{
opacity:1;
pointer-events:auto;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

.balloons{
font-size:40px;
animation: float 2s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(20px); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-30px); opacity:0;}
}

/* PHOTOS */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
max-width:600px;
}

.gallery img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<div class="balloons">🎈🎈🎈🎈🎈</div>

<h1>HAPPY BIRTHDAY MY LOVE ❤️</h1>

<p>Tap below to start 🎬</p>

<button onclick="go(2)">Start</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">

<h1>💌 Message</h1>

<p style="max-width:500px; line-height:1.6;">
Happy Birthday Sarita ❤️<br><br>
You are my best friend, my happiness, my peace 🫶
</p>

<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">

<h1>📸 Memories</h1>

<div class="gallery">

<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
<img src="happy.jpeg">
<img src="weird.JPG">
<img src="musa_1.jpg">
<img src="me.JPG">

</div>

<!-- IMPORTANT: CLEAR NEXT BUTTON -->
<button onclick="go(4)">Continue ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1>🎥 Video Moment</h1>

<video width="300" controls>
<source src="Video.MOV">
</video>

<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">

<h1>💖 Final</h1>

<p>I LOVE YOU MERO MUSA ❤️</p>

</div>

<script>

function go(p){
document.querySelectorAll(".page").forEach(x=>{
x.classList.remove("active");
});
document.getElementById("p"+p).classList.add("active");
}

</script>

</body>
</html>
