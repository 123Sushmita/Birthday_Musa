<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
color:white;
background:black;
}

/* STAR BACKGROUND */
.stars{
position:fixed;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
z-index:-3;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:fall 6s linear infinite;
opacity:0.8;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

/* NETFLIX INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 4s forwards;
animation-delay:2.5s;
}

#intro h1{
color:#e50914;
font-size:40px;
text-shadow:0 0 20px #e50914;
}

/* PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.8s;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* TYPEWRITER */
.type{
border-right:2px solid white;
white-space:nowrap;
overflow:hidden;
animation:typing 3s steps(40,end), blink .8s infinite;
}

@keyframes blink{
50%{border-color:transparent;}
}

/* HUG SILHOUETTE */
.hug{
font-size:60px;
animation:hug 1.5s infinite alternate;
}

@keyframes hug{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

/* CREDITS */
.credits{
position:fixed;
bottom:-100%;
width:100%;
text-align:center;
animation:roll 8s linear forwards;
}

@keyframes roll{
to{bottom:100%;}
}

</style>
</head>

<body>

<!-- STAR BACKGROUND -->
<div class="stars" id="stars"></div>

<!-- INTRO -->
<div id="intro">
<h1>NETFLIX PRESENTS</h1>
<p>🎬 A Love Story</p>
</div>

<!-- AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<h1>🎉 HAPPY BIRTHDAY</h1>
<button onclick="unlock(); go(2)">Start 🎬</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1 class="type" id="t1"></h1>
<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1>💖 What I Love About You</h1>
<p>Everything about you matters ❤️</p>
<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<h1>🎮 Game Page</h1>
<p>All your beauty in one soul 🫶</p>
<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
<h1>🫶 Hug Scene</h1>
<div class="hug">🧑‍🤝‍🧑💞</div>
<button onclick="go(6)">Next ➜</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">
<h1>🎬 Movie Credits</h1>
<div class="credits">
<h2>Directed by: Love ❤️</h2>
<p>Starring: You & Me 🫶</p>
<p>Produced by: Memories ✨</p>
</div>
<button onclick="final()">End 🎆</button>
</div>

<script>

/* STARS */
for(let i=0;i<80;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(2+Math.random()*5)+"s";
document.getElementById("stars").appendChild(s);
}

/* AUDIO FIX */
let audios=["a1","a2","a3","a4","a5","a6"];
let unlocked=false;

function unlock(){
unlocked=true;
}

/* PAGE CONTROL */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* AUDIO */
if(unlocked && p>=2){
let a=document.getElementById(audios[p-2]);
if(a){
a.currentTime=0;
a.play().catch(()=>{});
}
}

/* TYPE TEXT */
if(p===2){
typeText("You are my peace, my home, my everything ❤️");
}
}

/* TYPEWRITER */
function typeText(text){
let i=0;
let el=document.getElementById("t1");
el.innerHTML="";
let interval=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length) clearInterval(interval);
},60);
}

/* FINAL */
function final(){
document.body.style.filter="brightness(1.2)";
alert("❤️ HAPPY BIRTHDAY MY LOVE ❤️");
}

</script>

</body>
</html>
