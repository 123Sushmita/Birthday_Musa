<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
color:white;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,#0b0015,#1a0025,#2b0033,#000);
background-size:400% 400%;
animation:bg 10s ease infinite;
z-index:-3;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* NETFLIX INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 3.5s forwards;
animation-delay:2s;
}

#intro h1{
font-size:40px;
letter-spacing:5px;
color:#e50914;
text-shadow:0 0 20px #e50914;
animation:zoom 2s ease;
}

@keyframes zoom{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.8s;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:14px 24px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* TITLE */
.title{
font-size:40px;
text-shadow:0 0 25px #ff4d6d;
}

/* CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
background:red;
top:-10px;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}

/* GAME */
.card{
width:80%;
padding:18px;
margin:10px;
background:#ff4d6d;
border-radius:15px;
font-size:18px;
font-weight:bold;
}

/* NAME GLOW */
.glow{
font-size:40px;
color:white;
text-shadow:0 0 20px #ff4d6d,0 0 40px #ff4d6d;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

/* HUG ANIMATION */
.hug{
font-size:60px;
position:relative;
animation:hugMove 2s infinite alternate;
}

@keyframes hugMove{
from{transform:translateX(-30px);}
to{transform:translateX(30px);}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- NETFLIX INTRO -->
<div id="intro">
<h1>NETFLIX PRESENTS</h1>
</div>

<!-- AUDIO (6 SCENES) -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="title">🎉 HAPPY BIRTHDAY MY LOVE ❤️</div>
<button onclick="go(2)">Start Movie 🎬</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1>💌 Open Surprise</h1>
<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1>💖 Message</h1>
<p>You are my peace, my home, my everything ❤️</p>
<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<h1>🎮 Why You Matter</h1>
<div class="card">Your smile 😊</div>
<div class="card">Your heart 💖</div>
<div class="card">Your soul 🫶</div>
<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
<h1>📸 Memories</h1>
<button onclick="go(6)">Next ➜</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">
<div class="glow">HAPPY BIRTHDAY SARITA ❤️</div>
<div class="hug">🧑‍🤝‍🧑💞</div>
<p>Forever together 🫶</p>
</div>

<script>

let audios=["a1","a2","a3","a4","a5","a6"];

/* PAGE CHANGE + AUDIO SYNC */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

let audio=document.getElementById(audios[p-1]);
if(audio){
audio.currentTime=0;
audio.play().catch(()=>{});
}

if(p===6){
startConfetti();
}
}

/* CONFETTI */
function startConfetti(){
for(let i=0;i<80;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff4d6d","#fff","#ffd700","#ff69b4"][Math.floor(Math.random()*4)];
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);
}
}

</script>

</body>
</html>
