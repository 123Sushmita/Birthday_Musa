<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love❤️</title>

<style>

/* 🎬 GLOBAL THEME */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#0b0b0f;
color:white;
overflow:hidden;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at top,#1a1a1a,#000);
z-index:-10;
}

/* 🎬 SCENES */
.scene{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transform:scale(1.05);
transition:1s ease;
padding:20px;
}

.scene.active{
opacity:1;
pointer-events:auto;
transform:scale(1);
}

/* 🎭 TITLE */
h1,h2{
text-shadow:0 0 25px rgba(255,77,109,0.4);
}

/* 🔘 BUTTON */
button{
padding:12px 22px;
border:none;
border-radius:30px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
color:white;
margin-top:15px;
cursor:pointer;
}

/* 💬 CHAT */
.chatBox{
width:90%;
max-width:500px;
height:360px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border-radius:20px;
padding:15px;
overflow-y:auto;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#222;
color:white;
}

/* 💌 SPECIAL */
.specialCard{
width:300px;
height:200px;
border-radius:20px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* 💥 FLOAT MSG */
.float{
position:fixed;
padding:12px 16px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:15px;
animation:pop 0.8s ease forwards;
}

@keyframes pop{
from{opacity:0;transform:scale(0.3);}
to{opacity:1;transform:scale(1);}
}

/* 🎮 LOVE CARDS */
.loveGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
width:90%;
max-width:500px;
}

.loveGrid button{
height:55px;
border-radius:15px;
}

/* 💖 LOVE OUTPUT */
#loveText{
margin-top:15px;
font-size:20px;
padding:12px 16px;
background:rgba(255,255,255,0.06);
border-radius:15px;
}

/* 📸 MEMORY FILM */
.memGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
width:90%;
max-width:900px;
}

.mem{
border-radius:16px;
overflow:hidden;
cursor:pointer;
transition:0.4s;
}

.mem img{
width:100%;
height:150px;
object-fit:cover;
transition:0.4s;
}

.mem:hover img{
transform:scale(1.1);
filter:brightness(0.7);
}

/* 🎬 CINEMA VIEW */
#cinema{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.95);
z-index:9999;
}

#cinemaImg{
width:80%;
height:320px;
border-radius:20px;
background-size:cover;
background-position:center;
}

#cinemaText{
margin-top:15px;
font-size:20px;
max-width:80%;
}

/* 💥 MAGIC POP */
.magic{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.2);
background:#ff4d6d;
padding:18px;
border-radius:18px;
opacity:0;
transition:0.4s;
z-index:9999;
}

.magic.show{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎬 SCENES -->

<div class="scene active" id="s1">
<h1>💬 Chat With Musa</h1>

<div class="chatBox">
<div class="msg me">Hi mero musa ❤️</div>

<div class="msg her">
<input id="chat1" placeholder="Type reply..." onkeydown="chatNext(event)">
</div>
</div>

<button id="startBtn" style="display:none" onclick="go(2)">Start 🎬</button>
</div>

<!-- 💌 -->
<div class="scene" id="s2">
<h2>💌 Special Message</h2>

<div class="specialCard" onclick="special()">
<h3>HBD GIRL ❤️</h3>
<p>Tap to open</p>
</div>

<button onclick="go(3)">Next 🎬</button>
</div>

<!-- 🎮 -->
<div class="scene" id="s3">
<h2>🎮 What I Love</h2>

<div class="loveGrid">
<button onclick="love(1)">1</button>
<button onclick="love(2)">2</button>
<button onclick="love(3)">3</button>
<button onclick="love(4)">4</button>
<button onclick="love(5)">5</button>
<button onclick="love(6)">6</button>
<button onclick="love(7)">7</button>
<button onclick="love(8)">8</button>
<button onclick="love(9)">9</button>
<button onclick="love(10)">10</button>
</div>

<div id="loveText"></div>

<button onclick="go(4)">Next 🎬</button>
</div>

<!-- 📸 -->
<div class="scene" id="s4">
<h2>📸 Memories</h2>

<div class="memGrid">

<div class="mem" onclick="mem('We laughed 😂❤️','us.jpeg')"><img src="us.jpeg"></div>
<div class="mem" onclick="mem('Safe place 🫶','Bum.JPG')"><img src="Bum.JPG"></div>
<div class="mem" onclick="mem('Chaos 🌈','weeeee.JPG')"><img src="weeeee.JPG"></div>
<div class="mem" onclick="mem('Family ❤️','family.JPG')"><img src="family.JPG"></div>
<div class="mem" onclick="mem('Best bond 💖','happy.jpeg')"><img src="happy.jpeg"></div>

</div>

<button onclick="go(5)">Next 🎬</button>
</div>

<!-- 💌 THANK YOU -->
<div class="scene" id="s5">
<h2>💌 Thank You</h2>

<button onclick="thanks()">Reveal 💥</button>

<button onclick="go(6)">Next 🎬</button>
</div>

<!-- 🎥 -->
<div class="scene" id="s6">
<h2>🎥 Video Memory</h2>

<video controls playsinline>
<source src="Video.MOV">
</video>

<button onclick="go(7)">Next 🎬</button>
</div>

<!-- 🎉 FINAL -->
<div class="scene" id="s7">
<h1>🎉 HAPPY BIRTHDAY SARITA ❤️</h1>
<p>Forever my best friend 🫶</p>
</div>

<!-- CINEMA -->
<div id="cinema">
<div id="cinemaImg"></div>
<div id="cinemaText"></div>
<button onclick="closeCinema()">Close</button>
</div>

<script>

/* NAV */
function go(n){
document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+n).classList.add("active");
}

/* CHAT */
function chatNext(e){
if(e.key==="Enter"){
document.getElementById("startBtn").style.display="block";
}
}

/* SPECIAL */
function special(){
let msgs=["Safe ❤️","Family 🫶","Happiness 🌈","Everything 💖"];

msgs.forEach((m,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="magic show";
d.innerText=m;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
},i*700);
});
}

/* LOVE */
function love(n){
let arr=["Beautiful","Kind","Funny","Strong","Loyal","Best","Rare","Caring","Pure","Forever"];
document.getElementById("loveText").innerText=arr[n-1];
}

/* MEM */
function mem(t,img){
document.getElementById("cinema").style.display="flex";
document.getElementById("cinemaImg").style.backgroundImage=`url(${img})`;
document.getElementById("cinemaText").innerText=t;
}

function closeCinema(){
document.getElementById("cinema").style.display="none";
}

/* THANKS */
function thanks(){
let arr=[
"Thank you ❤️",
"Thank you 🌈",
"Thank you 🫶",
"Thank you 🌸",
"Thank you 💖"
];

arr.forEach((t,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="magic show";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
},i*600);
});
}

</script>

</body>
</html>
