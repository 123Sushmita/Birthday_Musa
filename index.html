<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
overflow:hidden;
color:white;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#200020,#000);
z-index:-5;
animation:move 10s infinite alternate;
}

@keyframes move{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(30deg);}
}

/* 🎬 PAGE TRANSITION */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
transform:scale(1.05);
transition:0.8s ease;
pointer-events:none;
padding:20px;
}

.active{
opacity:1;
transform:scale(1);
pointer-events:auto;
}

/* 🔘 BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}

/* 💖 TITLE */
.glow{
font-size:38px;
text-shadow:0 0 20px #ff4d6d;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.08);}
}

/* 📸 GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
max-width:90%;
}

.gallery img{
width:100%;
height:85px;
object-fit:cover;
border-radius:10px;
}

/* 🎮 GAME */
.game{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.game button{
padding:10px;
border-radius:8px;
}

/* 🎥 VIDEO */
video{
width:300px;
border-radius:12px;
}

/* 🎆 CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}

/* 🫶 HUG */
.hug{
font-size:60px;
animation:beat 1.2s infinite;
}

@keyframes beat{
50%{transform:scale(1.2);}
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎵 AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="glow">🎉 HAPPY BIRTHDAY Mero Musa ❤️</div>
<button onclick="go(2)">Start ➜</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h2>💌 A Special Message</h2>
<p>You are my peace, my chaos, my happiness, my family, my everything ❤️</p>
<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">
<h2>🎮 What I Love About You</h2>

<div class="game">
<button onclick="show(1)">1</button>
<button onclick="show(2)">2</button>
<button onclick="show(3)">3</button>
<button onclick="show(4)">4</button>
<button onclick="show(5)">5</button>
<button onclick="show(6)">6</button>
<button onclick="show(7)">7</button>
<button onclick="show(8)">8</button>
<button onclick="show(9)">9</button>
<button onclick="show(10)">10</button>
</div>

<p id="msg"></p>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 PHOTOS -->
<div class="page" id="p4">
<h2>📸 Our Memories</h2>

<div class="gallery">
<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
</div>

<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 FUN -->
<div class="page" id="p5">
<h2>🫶 Our Friendship Moments</h2>

<p id="funText">Click to reveal memories 😂</p>

<button onclick="fun(1)">1</button>
<button onclick="fun(2)">2</button>
<button onclick="fun(3)">3</button>
<button onclick="fun(4)">4</button>
<button onclick="fun(5)">5</button>

<button onclick="go(6)">Next ➜</button>
</div>

<!-- PAGE 6 VIDEO -->
<div class="page" id="p6">
<h2>🎥 One Last Memory</h2>

<video controls>
<source src="Video.MOV" type="video/mp4">
</video>

<button onclick="go(7)">Next ➜</button>
</div>

<!-- PAGE 7 FINAL -->
<div class="page" id="p7">
<div class="glow">🎉 HAPPY BIRTHDAY SARITA 🎉</div>

<div class="hug">🫶💖🫶</div>

<p>Forever my best friend ❤️</p>

<button onclick="final()">Finish 🎆</button>
</div>

<script>

/* 🔇 HARD AUDIO STOP SYSTEM */
function stopAllAudio(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

/* 🎬 PAGE CONTROL */
let audios=["a1","a2","a3","a4","a5","a6"];

function go(p){

stopAllAudio();

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* audio sync */
let i=p-2;
if(i>=0 && i<audios.length){
let a=document.getElementById(audios[i]);
if(a){
a.play().catch(()=>{});
}
}
}

/* 🎮 GAME */
let msgs=[
"Your smile is everything 😊",
"You are kind 💖",
"You always support me 🫶",
"You are strong 💪",
"You are beautiful 🌸",
"You are my safe place ❤️",
"You are loyal 💛",
"You make life better 🌈",
"You are unforgettable ✨",
"You are my forever best friend ❤️"
];

function show(n){
document.getElementById("msg").innerText=msgs[n-1];
}

/* 🫶 FUN PAGE */
let funMsgs=[
"We laughed till stomach hurt 😂",
"Your BUMMM moments forever iconic",
"Late night talks 💖",
"Random gossip + fun 🌸",
"You are my safe chaos ❤️"
];

function fun(n){
document.getElementById("funText").innerText=funMsgs[n-1];
}

/* 🎆 FINAL CONFETTI */
function final(){

for(let i=0;i<150;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff4d6d","#fff","#ffd700","#ff69b4"][Math.floor(Math.random()*4)];
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);
}

document.body.style.filter="brightness(1.2)";
}

</script>

</body>
</html>
