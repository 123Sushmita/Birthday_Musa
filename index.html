<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sarita ❤️</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:black;
color:white;
overflow:hidden;
height:100vh;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-10;
}

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:1s ease;
padding:20px;
}

.page.active{
opacity:1;
pointer-events:auto;
}

.title{
font-size:38px;
margin-bottom:15px;
text-shadow:0 0 20px #ff4d6d;
}

/* BUTTON */
button{
padding:14px 24px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
margin-top:15px;
cursor:pointer;
font-size:16px;
}

/* CHAT */
.chat{
width:90%;
max-width:500px;
height:360px;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:15px;
overflow-y:auto;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#222;
color:white;
margin-top:10px;
}

/* BOX */
.box{
width:300px;
height:180px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:0.3s;
}

.box:hover{transform:scale(1.05);}

/* REVEAL GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
width:90%;
max-width:500px;
margin-top:10px;
}

.item{
background:#222;
padding:12px;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.item:hover{background:#ff4d6d;}

.output{
margin-top:15px;
font-size:18px;
min-height:30px;
}

/* THANK YOU */
.thankBox{
background:#111;
padding:15px;
border-radius:15px;
margin-top:10px;
width:80%;
}

.final{
font-size:40px;
text-shadow:0 0 20px #ff4d6d;
}

.hint{opacity:0.6;margin-top:10px;font-size:13px;}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎧 AUDIO -->
<audio id="a1" src="audio_1.mp3"></audio>
<audio id="a2" src="audio_2.mp3"></audio>
<audio id="a3" src="audio_3.mp3"></audio>
<audio id="a4" src="audio_4.mp3"></audio>
<audio id="a5" src="audio_5.mp3"></audio>
<audio id="a6" src="audio_6.mp3"></audio>

<!-- PAGE 1 CHAT -->
<div class="page active" id="p1">

<h1 class="title">💬 Chat With Musa</h1>

<div class="chat" id="chat">
<div class="msg me">Hi mero musa ❤️</div>
</div>

<input id="inp" placeholder="type hi..." onkeydown="chat(event)">

</div>

<!-- PAGE 2 SPECIAL -->
<div class="page" id="p2">

<h1 class="title">💌 Special Message</h1>

<div class="box" onclick="showSpecial()">
<h3>Open Me 💖</h3>
<p>Click the box</p>
</div>

<p class="output" id="specialText"></p>

<button onclick="go(3)">Next ▶</button>

</div>

<!-- PAGE 3 LOVE -->
<div class="page" id="p3">

<h1 class="title">🎮 What I Love Most</h1>

<div class="grid">
<div class="item" onclick="love(0)">Kind</div>
<div class="item" onclick="love(1)">Beautiful</div>
<div class="item" onclick="love(2)">Funny</div>
<div class="item" onclick="love(3)">Caring</div>
<div class="item" onclick="love(4)">Strong</div>
<div class="item" onclick="love(5)">Loyal</div>
<div class="item" onclick="love(6)">Supportive</div>
<div class="item" onclick="love(7)">Pure heart</div>
<div class="item" onclick="love(8)">Best soul</div>
<div class="item" onclick="love(9)">My person</div>
</div>

<p class="output" id="loveOut"></p>

<button onclick="go(4)">Next ▶</button>

</div>

<!-- PAGE 4 MEMORIES -->
<div class="page" id="p4">

<h1 class="title">📸 Memories</h1>

<img id="img" width="280" style="border-radius:15px;">

<button onclick="nextImg()">Next Memory ▶</button>

</div>

<!-- PAGE 5 THANK YOU -->
<div class="page" id="p5">

<h1 class="title">💌 Thank You</h1>

<div class="thankBox" id="thankBox"></div>

<button onclick="go(6)">Final ▶</button>

</div>

<!-- PAGE 6 FINAL -->
<div class="page" id="p6">

<div class="final">🎉 HAPPY BIRTHDAY SARITA ❤️</div>
<p>Forever my best friend 🫶</p>

</div>

<script>

/* AUDIO CONTROL */
function stopAll(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

function playAudio(n){
stopAll();
let a=document.getElementById("a"+n);
if(a){
a.play().catch(()=>{});
}
}

/* PAGE NAV */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

if(p>=1 && p<=6) playAudio(p);
}

/* CHAT FLOW */
function chat(e){
if(e.key!=="Enter") return;

let v=inp.value.trim();
if(!v) return;

chat.innerHTML += `<div class="msg her">${v}</div>`;

setTimeout(()=>{
chat.innerHTML += `<div class="msg me">Happy Birthday Musa 🎉❤️</div>`;
},400);

setTimeout(()=>{
chat.innerHTML += `<div class="msg me">I made something special for you 🫶</div>`;
},1000);

setTimeout(()=>{
chat.innerHTML += `<div class="msg me">Are you ready? ❤️</div>`;
setTimeout(()=>go(2),800);
},1800);

inp.value="";
}

/* SPECIAL MESSAGE */
function showSpecial(){
document.getElementById("specialText").innerText =
"You are my safe place ❤️\nYou are my happiness 🫶\nYou are my everything 💖";
}

/* LOVE */
let loveList=[
"Kind","Beautiful","Funny","Caring","Strong",
"Loyal","Supportive","Pure heart","Best soul","My person"
];

function love(i){
document.getElementById("loveOut").innerText=loveList[i];
}

/* MEMORIES */
let imgs=["us.jpeg","Bum.JPG","weeeee.JPG"];
let i=0;

function nextImg(){
document.getElementById("img").src=imgs[i];
i=(i+1)%imgs.length;
}

/* THANK YOU */
let thanks=[
"Thank you for trusting me ❤️",
"Thank you for loving me 🌈",
"Thank you for being there 🫶",
"Thank you for your patience 🌸",
"Thank you for everything 💖"
];

let t=0;

function startThanks(){
let box=document.getElementById("thankBox");

let interval=setInterval(()=>{
if(t>=thanks.length){
clearInterval(interval);
return;
}
box.innerHTML += "💖 "+thanks[t]+"<br>";
t++;
},1200);
}

setTimeout(()=>{
if(document.getElementById("p5").classList.contains("active")){
startThanks();
}
},2000);

</script>

</body>
</html>
