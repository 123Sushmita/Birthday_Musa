<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Sarita ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:white;
font-family:Arial;
overflow:hidden;
height:100vh;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-1;
}

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.8s ease;
padding:20px;
}

.page.active{
opacity:1;
pointer-events:auto;
}

.title{
font-size:38px;
margin-bottom:20px;
text-shadow:0 0 20px #ff4d6d;
}

/* BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
margin-top:15px;
cursor:pointer;
font-size:16px;
}

/* CHAT */
.chat{
width:90%;
max-width:500px;
height:360px;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:15px;
overflow-y:auto;
}

.msg{
margin:10px 0;
padding:10px 14px;
border-radius:15px;
max-width:75%;
}

.me{background:#ff4d6d;margin-left:auto;}
.her{background:#222;margin-right:auto;}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#222;
color:white;
margin-top:10px;
}

/* BOX */
.box{
width:300px;
height:180px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
width:90%;
max-width:500px;
margin-top:10px;
}

.item{
background:#222;
padding:12px;
border-radius:12px;
cursor:pointer;
}

.output{
margin-top:15px;
font-size:18px;
min-height:30px;
}

/* FINAL */
.final{
font-size:42px;
text-shadow:0 0 25px #ff4d6d;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🎧 AUDIO -->
<audio id="a1" src="audio_1.mp3"></audio>
<audio id="a2" src="audio_2.mp3"></audio>
<audio id="a3" src="audio_3.mp3"></audio>
<audio id="a4" src="audio_4.mp3"></audio>
<audio id="a5" src="audio_5.mp3"></audio>
<audio id="a6" src="audio_6.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<h1 class="title">💬 Chat With Musa</h1>

<div class="chat" id="chat">
<div class="msg me">Hi mero musa ❤️</div>
</div>

<input id="inp" placeholder="Type hi..." onkeydown="chat(event)">

</div>

<!-- PAGE 2 -->
<div class="page" id="p2">

<h1 class="title">💌 Special Message</h1>

<div class="box" onclick="go(3)">
<h3>Open Me 💖</h3>
<p>Click here</p>
</div>

<p id="special" class="output"></p>

</div>

<!-- PAGE 3 -->
<div class="page" id="p3">

<h1 class="title">🎮 What I Love Most</h1>

<div class="grid">
<div class="item" onclick="love(0)">Kind</div>
<div class="item" onclick="love(1)">Beautiful</div>
<div class="item" onclick="love(2)">Funny</div>
<div class="item" onclick="love(3)">Caring</div>
<div class="item" onclick="love(4)">Strong</div>
<div class="item" onclick="love(5)">Loyal</div>
<div class="item" onclick="love(6)">Support</div>
<div class="item" onclick="love(7)">Pure</div>
<div class="item" onclick="love(8)">Best</div>
<div class="item" onclick="love(9)">My Person</div>
</div>

<p id="loveOut" class="output"></p>

<button onclick="go(4)">Next ▶</button>

</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1 class="title">📸 Memories</h1>

<img id="img" width="260" style="border-radius:15px;">

<button onclick="nextImg()">Next Memory ▶</button>

</div>

<!-- PAGE 5 -->
<div class="page" id="p5">

<h1 class="title">💖 Thank You</h1>

<p id="thanks" class="output"></p>

<button onclick="go(6)">Final ▶</button>

</div>

<!-- PAGE 6 -->
<div class="page" id="p6">

<div class="final">🎉 HAPPY BIRTHDAY SARITA ❤️</div>
<p>Forever my best friend 🫶</p>

</div>

<script>

/* 🔊 AUDIO FIX (MAIN PART) */
let currentAudio = null;

function stopAllAudio(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime = 0;
});
currentAudio = null;
}

function playAudio(n){
stopAllAudio();

let audio = document.getElementById("a"+n);
if(audio){
currentAudio = audio;
audio.play().catch(()=>{});
}
}

/* 📄 PAGE SWITCH */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* play audio only for pages 1–5 */
if(p >= 1 && p <= 5){
playAudio(p);
}

/* no audio on final page */
if(p === 6){
stopAllAudio();
}
}

/* 💬 CHAT FLOW */
function chat(e){
if(e.key !== "Enter") return;

let v = inp.value.trim();
if(!v) return;

chat.innerHTML += `<div class="msg her">${v}</div>`;

setTimeout(()=>chat.innerHTML += `<div class="msg me">Happy Birthday Musa 🎉❤️</div>`,400);
setTimeout(()=>chat.innerHTML += `<div class="msg me">I made something special for you 🫶</div>`,1000);
setTimeout(()=>chat.innerHTML += `<div class="msg me">Are you ready? ❤️</div>`,1800);

setTimeout(()=>go(2),2400);

inp.value="";
}

/* 💌 SPECIAL */
document.getElementById("special").innerText =
"You are my safe place ❤️\nYou are my happiness 🫶\nYou are my everything 💖";

/* 🎮 LOVE */
let loveList=[
"Kind","Beautiful","Funny","Caring","Strong",
"Loyal","Support","Pure","Best","My Person"
];

function love(i){
loveOut.innerText = loveList[i];
}

/* 📸 MEMORIES */
let imgs=["us.jpeg","Bum.JPG","weeeee.JPG"];
let i=0;

function nextImg(){
img.src = imgs[i];
i = (i+1) % imgs.length;
}

/* 💖 THANK YOU */
let th=[
"Thank you for trusting me ❤️",
"Thank you for loving me 🌈",
"Thank you for always being there 🫶",
"Thank you for staying calm 🌸",
"Thank you for everything 💖"
];

let t=0;

setInterval(()=>{
if(document.getElementById("p5").classList.contains("active")){
thanks.innerHTML += th[t]+"<br>";
t = (t+1)%th.length;
}
},1200);

</script>

</body>
</html>
