<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
overflow:hidden;
}

/* PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;

opacity:0;
pointer-events:none;
transition:0.6s ease;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

/* PAGE 1 */
.balloons{
font-size:40px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(20px);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-30px);opacity:0;}
}

/* BOX */
.box{
width:240px;
height:140px;
background:#ff4d6d;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
}

/* PAPER */
#paper{
position:fixed;
top:60%;
left:50%;
transform:translate(-50%,0);
background:white;
color:black;
padding:20px;
border-radius:12px;
max-width:320px;
opacity:0;
transition:1s ease;
z-index:5;
}

.fly{
top:10% !important;
opacity:1 !important;
}

/* TOP MESSAGE */
#msg{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,0.1);
padding:12px;
border-radius:10px;
max-width:85%;
display:none;
font-size:14px;
}

/* GAME */
.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
padding:15px;
}

.card{
width:55px;
height:55px;
background:#ff4d6d;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
font-weight:bold;
cursor:pointer;
transition:0.4s;
}

.card.flipped{
background:white;
color:black;
transform:scale(1.1);
}

/* PHOTOS */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:10px;
}

.gallery img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}
</style>
</head>

<body>

<!-- 🎵 AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<div class="balloons">🎈🎈🎈🎈🎈</div>
<h1>HAPPY BIRTHDAY MY LOVE ❤️</h1>

<button onclick="go(2)">Start</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">

<h1>💌 Open Your Surprise</h1>

<div class="box" onclick="openBox()">
🎁 Happy Birthday Girl 💖<br>Click Me
</div>

<div id="paper"></div>

<div id="msg"></div>

<button id="nextBtn" onclick="go(3)" style="display:none;">
👉 Continue Journey
</button>

</div>

<!-- PAGE 3 -->
<div class="page" id="p3">

<h1>💖 What I Love Most</h1>

<div class="grid">

<div class="card" onclick="flip(this,1)">1</div>
<div class="card" onclick="flip(this,2)">2</div>
<div class="card" onclick="flip(this,3)">3</div>
<div class="card" onclick="flip(this,4)">4</div>
<div class="card" onclick="flip(this,5)">5</div>
<div class="card" onclick="flip(this,6)">6</div>
<div class="card" onclick="flip(this,7)">7</div>
<div class="card" onclick="flip(this,8)">8</div>
<div class="card" onclick="flip(this,9)">9</div>
<div class="card" onclick="flip(this,10)">10</div>

</div>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1>📸 Memories</h1>

<div class="gallery">

<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
<img src="happy.jpeg">
<img src="weird.JPG">
<img src="musa_1.jpg">
<img src="me.JPG">

</div>

</div>

<script>

/* NAVIGATION */
function go(p){

document.querySelectorAll(".page").forEach(x=>{
x.classList.remove("active");
});

document.getElementById("p"+p).classList.add("active");

/* AUDIO START AFTER FIRST CLICK */
if(p>=2 && p<=6){
playAudio(p-2);
}
}

/* AUDIO FIX */
let audios=[
"a1","a2","a3","a4","a5","a6"
];

let started=false;

function playAudio(i){

if(!started) started=true;

audios.forEach(id=>{
let a=document.getElementById(id);
if(a){
a.pause();
a.currentTime=0;
}
});

let current=document.getElementById(audios[i]);
if(current){
current.play().catch(()=>{});
}
}

/* PAGE 2 BOX */
function openBox(){

document.getElementById("paper").innerHTML=`
Hey beautiful ❤️<br><br>
Happy Birthday! Wishing you a peaceful and prosperous life ahead.<br><br>
You mean everything to me… I love you 💖
`;

document.getElementById("paper").classList.add("fly");

setTimeout(()=>{
document.getElementById("msg").style.display="block";
document.getElementById("msg").innerHTML=
"💌 Read the message above ❤️";
},1200);

setTimeout(()=>{
document.getElementById("nextBtn").style.display="block";
},1800);

}

/* GAME */
let data=[
"Your eyes 👁️",
"Your smile 😊",
"Your heart 💖",
"Your kindness 🫶",
"Your support ❤️",
"Your loyalty 💛",
"Your strength 💪",
"Your honesty ✨",
"Your vibe 🌸",
"Everything about you 💖"
];

function flip(el,n){
el.classList.add("flipped");
setTimeout(()=>{
el.innerHTML=data[n-1];
},200);
}

</script>

</body>
</html>
