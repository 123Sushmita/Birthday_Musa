<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
color:white;
}

/* BACKGROUND CELEBRATION */
.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,#ff4d6d,#1a001f,#3b0a45,#000);
background-size:400% 400%;
animation:move 8s ease infinite;
z-index:-1;
}

@keyframes move{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* FLOATING HEARTS */
.heart{
position:fixed;
bottom:-50px;
font-size:20px;
animation:up 6s linear infinite;
opacity:0.7;
}

@keyframes up{
0%{transform:translateY(0);opacity:0;}
30%{opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}

/* PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.8s;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:14px 24px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* PAGE 1 */
.title{
font-size:38px;
text-shadow:0 0 25px #ff4d6d;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

/* PAGE 2 MULTI MESSAGES */
.msg{
position:absolute;
font-size:18px;
background:rgba(255,255,255,0.15);
padding:12px 18px;
border-radius:12px;
animation:fade 2s ease;
max-width:200px;
}

@keyframes fade{
from{opacity:0;transform:scale(0.5);}
to{opacity:1;transform:scale(1);}
}

/* GAME BIG CARDS */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
height:120px;
background:#ff4d6d;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.4s;
padding:10px;
text-align:center;
}

.card.flipped{
background:white;
color:black;
transform:scale(1.05);
}

/* PHOTOS */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:10px;
}

.gallery img{
width:100%;
height:130px;
object-fit:cover;
border-radius:10px;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<div class="title">🎉 HAPPY BIRTHDAY MY LOVE ❤️</div>
<p>Today is your special day ✨</p>

<button onclick="go(2)">Start Celebration 🎈</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">

<h1>💌 Messages For You</h1>

<button onclick="showMessages()">Open Love Messages 💖</button>

<div id="container"></div>

<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">

<h1>💖 What I Love About You</h1>

<div class="grid">

<div class="card" onclick="flip(this,1)">Your eyes 👁️</div>
<div class="card" onclick="flip(this,2)">Your smile 😊</div>
<div class="card" onclick="flip(this,3)">Your heart 💖</div>
<div class="card" onclick="flip(this,4)">Your kindness 🫶</div>
<div class="card" onclick="flip(this,5)">Your loyalty 💛</div>
<div class="card" onclick="flip(this,6)">Your support ❤️</div>
<div class="card" onclick="flip(this,7)">Your strength 💪</div>
<div class="card" onclick="flip(this,8)">Everything 💖</div>

</div>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">

<h1>📸 Memories</h1>

<div class="gallery">
<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
</div>

</div>

<script>

/* PAGE NAV */
function go(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

/* PAGE 2 MULTI MESSAGE ANIMATION */
function showMessages(){

let container=document.getElementById("container");
container.innerHTML="";

let messages=[
{t:"top:10%;left:50%",text:"You are my peace ❤️"},
{t:"top:40%;left:10%",text:"I love your smile 😊"},
{t:"top:50%;right:10%",text:"You are my happiness 💖"},
{t:"bottom:20%;left:40%",text:"Stay always with me 🫶"},
{t:"top:70%;left:50%",text:"Happy Birthday My Love 🎉"}
];

messages.forEach((m,i)=>{
setTimeout(()=>{
let d=document.createElement("div");
d.className="msg";
d.style.cssText=m.t;
d.innerHTML=m.text;
container.appendChild(d);
},i*400);
});

}

/* GAME */
let data=[
"Your eyes are beautiful 👁️",
"Your smile brightens everything 😊",
"Your heart is pure 💖",
"Your kindness is rare 🫶",
"Your loyalty means everything 💛",
"Your support keeps me strong ❤️",
"Your strength inspires me 💪",
"Everything about you is perfect 💖"
];

function flip(el,n){
el.classList.add("flipped");
setTimeout(()=>{
el.innerHTML=data[n-1];
},200);
}

/* FLOATING HEARTS */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);

</script>

</body>
</html>
