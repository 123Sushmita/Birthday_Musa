<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Best Friend ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:black;
color:white;
overflow:hidden;
height:100vh;
}

/* 🌌 BACKGROUND */

.bg{
position:fixed;
width:120%;
height:120%;
background:radial-gradient(circle,#1a1a1a,#000);
z-index:-10;
}

/* 🎬 PAGES */

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transform:scale(1.1);
transition:1s ease;
}

.page.active{
opacity:1;
pointer-events:auto;
transform:scale(1);
}

/* 🎬 TITLE */

.title{
font-size:32px;
text-shadow:0 0 20px #ff4d6d;
margin-bottom:15px;
}

/* 🔘 BUTTON */

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
margin-top:15px;
cursor:pointer;
}

/* 💬 CHAT */

#chatBox{
width:90%;
max-width:500px;
height:380px;
overflow-y:auto;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:20px;
}

.msg{
margin:10px 0;
padding:10px;
border-radius:15px;
max-width:75%;
}

.me{
background:#ff4d6d;
margin-left:auto;
}

.her{
background:#222;
margin-right:auto;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
background:#222;
color:white;
}

/* 💌 SPECIAL BOX */

.specialBox{
width:300px;
height:200px;
background:linear-gradient(145deg,#ff4d6d,#ff758f);
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* 💌 FLOAT MSG */

.floatMsg{
position:absolute;
padding:12px;
background:rgba(255,255,255,0.1);
border-radius:15px;
animation:pop 1s forwards;
}

@keyframes pop{
from{opacity:0;transform:scale(0.3);}
to{opacity:1;transform:scale(1);}
}

/* 📸 MEMORY GRID */

.memoryGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
width:90%;
max-width:900px;
}

.memItem{
border-radius:15px;
overflow:hidden;
cursor:pointer;
}

.memItem img{
width:100%;
height:150px;
object-fit:cover;
}

/* 🎬 CINEMA */

#cinema{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.95);
z-index:9999;
}

#cinemaImg{
width:80%;
height:300px;
background-size:cover;
border-radius:20px;
}

#cinemaText{
margin-top:15px;
font-size:20px;
max-width:80%;
text-align:center;
}

/* 💖 HEARTS */

.heart{
position:fixed;
font-size:18px;
animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
to{transform:translateY(-120vh);opacity:0;}
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- 🔊 AUDIO (NO AUDIO ON VIDEO PAGE) -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>

<!-- 💬 PAGE 1 CHAT -->
<div class="page active" id="p1">

<h1 class="title">💬 Chat With Musa</h1>

<div id="chatBox">
<div class="msg me">Hi mero musa ❤️</div>

<div class="msg her">
<input id="r1" placeholder="Type reply..." onkeydown="step1(event)">
</div>
</div>

<button id="startBtn" style="display:none" onclick="go(2)">
Start 🎬
</button>

</div>

<!-- 💌 PAGE 2 -->
<div class="page" id="p2">

<h2 class="title">💌 Special Message</h2>

<div class="specialBox" onclick="openSpecial()">
<h3>HBD GIRL ❤️</h3>
<p>Click me</p>
</div>

<div id="floatBox"></div>

<button onclick="go(3)">Next 🎬</button>

</div>

<!-- 🎮 PAGE 3 -->
<div class="page" id="p3">

<h2 class="title">🎮 What I Love</h2>

<div class="memoryGrid">

<button onclick="showLove(1)">1</button>
<button onclick="showLove(2)">2</button>
<button onclick="showLove(3)">3</button>
<button onclick="showLove(4)">4</button>
<button onclick="showLove(5)">5</button>
<button onclick="showLove(6)">6</button>
<button onclick="showLove(7)">7</button>
<button onclick="showLove(8)">8</button>
<button onclick="showLove(9)">9</button>
<button onclick="showLove(10)">10</button>

</div>

<p id="loveText"></p>

<button onclick="go(4)">Next</button>

</div>

<!-- 📸 MEMORY GOD MODE -->
<div class="page" id="p4">

<h2 class="title">📸 Memories</h2>

<div class="memoryGrid">

<div class="memItem" onclick="openMem('We laughed together 😂❤️','us.jpeg')"><img src="us.jpeg"></div>
<div class="memItem" onclick="openMem('You are my safe place 🫶','Bum.JPG')"><img src="Bum.JPG"></div>
<div class="memItem" onclick="openMem('Chaos moments 🌈','weeeee.JPG')"><img src="weeeee.JPG"></div>
<div class="memItem" onclick="openMem('Family ❤️','family.JPG')"><img src="family.JPG"></div>
<div class="memItem" onclick="openMem('Best bond 💖','happy.jpeg')"><img src="happy.jpeg"></div>

</div>

<button onclick="go(5)">Next</button>

</div>

<!-- 💌 THANK YOU -->
<div class="page" id="p5">

<h2 class="title">💌 Thank You</h2>

<button onclick="nextThanks()">Reveal</button>

<p id="thanksText"></p>

<button onclick="go(6)">Next</button>

</div>

<!-- 🎥 VIDEO -->
<div class="page" id="p6">

<h2 class="title">🎥 Video Memory</h2>

<video controls playsinline>
<source src="Video.MOV">
</video>

<button onclick="go(7)">Final</button>

</div>

<!-- 🎆 FINAL -->
<div class="page" id="p7">

<h1 class="title">🎉 HAPPY BIRTHDAY SARITA ❤️</h1>
<p>Forever my best friend 🫶</p>

</div>

<!-- 🎬 CINEMA -->
<div id="cinema">

<div id="cinemaImg"></div>
<div id="cinemaText"></div>

<button onclick="closeMem()">Close</button>

</div>

<script>

/* PAGE SWITCH + AUDIO FIX */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* 🚨 STOP ALL AUDIO ON VIDEO PAGE */
if(p === 6){
stopAll();
}
else if(p>=2 && p<=5){
stopAll();
let a=document.getElementById("a"+(p-1));
if(a) a.play().catch(()=>{});
}

}

/* STOP AUDIO */
function stopAll(){
document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});
}

/* CHAT */
function step1(e){
if(e.key==="Enter"){
let val=document.getElementById("r1").value;
if(val){
document.getElementById("chatBox").innerHTML += `
<div class="msg me">Happy Birthday ❤️</div>
`;
document.getElementById("startBtn").style.display="block";
}
}
}

/* SPECIAL */
function openSpecial(){

document.querySelector(".specialBox").style.display="none";

let msgs=[
"Safe place ❤️",
"Family 🫶",
"Happiness 🌈",
"Everything 💖",
"Best friend forever ✨"
];

for(let i=0;i<msgs.length;i++){

setTimeout(()=>{

let d=document.createElement("div");
d.className="floatMsg";
d.innerHTML=msgs[i];
d.style.left=Math.random()*80+"vw";
d.style.top=Math.random()*80+"vh";

document.getElementById("floatBox").appendChild(d);

},i*800);

}

}

/* LOVE */
function showLove(n){
let arr=["Beautiful","Kind","Funny","Strong","Loyal","Best","Sweet","Caring","Rare","Forever"];
document.getElementById("loveText").innerText=arr[n-1];
}

/* MEMORY */
function openMem(text,img){
document.getElementById("cinema").style.display="flex";
document.getElementById("cinemaImg").style.backgroundImage=`url(${img})`;
document.getElementById("cinemaText").innerText=text;
}

/* CLOSE */
function closeMem(){
document.getElementById("cinema").style.display="none";
}

/* THANKS */
let t=0;
let thanks=[
"Thank you for trusting me ❤️",
"Thank you for happiness 🌈",
"Thank you for support 🫶",
"Thank you for calm 🌸",
"Thank you sister-in-law 😂💖"
];

function nextThanks(){
document.getElementById("thanksText").innerText=thanks[t];
t=(t+1)%thanks.length;
}

</script>

</body>
</html>
