<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:black;
color:white;
}

/* 🌌 STAR FIELD */
.stars{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-5;
background:radial-gradient(circle,#120018,#000);
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:fall linear infinite;
opacity:0.8;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

/* 🎬 NETFLIX INTRO */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
animation:fadeOut 4s forwards;
animation-delay:2.5s;
}

#intro h1{
color:#e50914;
font-size:42px;
letter-spacing:3px;
text-shadow:0 0 20px #e50914;
animation:zoom 2s ease;
}

@keyframes zoom{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* 📱 PAGES */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:1s ease;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* 🔘 BUTTON */
button{
padding:14px 24px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* 💖 TITLE GLOW */
.glow{
font-size:40px;
text-shadow:0 0 25px #ff4d6d,0 0 40px #ff4d6d;
animation:pulse 1.8s infinite;
}

@keyframes pulse{
50%{transform:scale(1.08);}
}

/* 💌 TYPE EFFECT */
.type{
border-right:2px solid white;
white-space:nowrap;
overflow:hidden;
animation:blink .8s infinite;
font-size:18px;
max-width:90%;
}

@keyframes blink{
50%{border-color:transparent;}
}

/* 🫶 HUG */
.hug{
font-size:70px;
animation:hug 1.5s infinite alternate;
filter:drop-shadow(0 0 10px pink);
}

@keyframes hug{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* 🎞 CREDITS */
.credits{
position:fixed;
bottom:-100%;
width:100%;
text-align:center;
animation:roll 10s linear forwards;
}

@keyframes roll{
to{bottom:120%;}
}

/* 🎆 CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fallConf 3s linear forwards;
}

@keyframes fallConf{
to{transform:translateY(110vh) rotate(360deg);}
}

/* 📳 SHAKE */
.shake{
animation:shake 0.4s;
}

@keyframes shake{
0%{transform:translate(0);}
25%{transform:translate(-5px,5px);}
50%{transform:translate(5px,-5px);}
75%{transform:translate(-5px);}
100%{transform:translate(0);}
}

</style>
</head>

<body>

<!-- 🌌 STARS -->
<div class="stars" id="stars"></div>

<!-- 🎬 INTRO -->
<div id="intro">
<h1>NETFLIX PRESENTS</h1>
<p>🎬 A Love Story</p>
</div>

<!-- 🎵 AUDIO -->
<audio id="a1" src="audio_1.m4a"></audio>
<audio id="a2" src="audio_2.m4a"></audio>
<audio id="a3" src="audio_3.m4a"></audio>
<audio id="a4" src="audio_4.m4a"></audio>
<audio id="a5" src="audio_5.m4a"></audio>
<audio id="a6" src="audio_6.m4a"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="glow">🎉 HAPPY BIRTHDAY MY LOVE ❤️</div>
<button onclick="unlock(); go(2)">Start Movie 🎬</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<h1 class="type" id="typeText"></h1>
<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1>💖 What I Love About You</h1>
<p>You are my calm in chaos ❤️</p>
<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
<h1>🎮 Your Magic</h1>
<p>Everything about you feels like home 🫶</p>
<button onclick="go(5)">Next ➜</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="p5">
<h1>🫶 The Hug Scene</h1>
<div class="hug">🧑‍🤝‍🧑💞</div>
<button onclick="go(6)">Next ➜</button>
</div>

<!-- PAGE 6 -->
<div class="page" id="p6">
<div class="glow">❤️ HAPPY BIRTHDAY SARITA ❤️</div>
<button onclick="final()">End Movie 🎆</button>
</div>

<!-- PAGE 7 (CREDITS) -->
<div class="page" id="p7">
<div class="credits">
<h2>🎬 Directed by Love</h2>
<p>Starring: You & Me 💞</p>
<p>Produced by Memories ✨</p>
</div>
</div>

<script>

/* 🌌 STARS */
for(let i=0;i<100;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(2+Math.random()*5)+"s";
document.getElementById("stars").appendChild(s);
}

/* 🎵 AUDIO */
let audios=["a1","a2","a3","a4","a5","a6"];
let unlocked=false;

function unlock(){
unlocked=true;
}

/* 🎬 PAGE CONTROL */
function go(p){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");

/* 🎵 AUDIO SYNC */
if(unlocked && p>=2){
let a=document.getElementById(audios[p-2]);
if(a){
a.currentTime=0;
a.play().catch(()=>{});
}
}

/* 💌 TYPE TEXT */
if(p===2){
typeEffect("You are my peace, my home, my everything ❤️");
}
}

/* 💌 TYPE EFFECT */
function typeEffect(text){
let i=0;
let el=document.getElementById("typeText");
el.innerHTML="";
let t=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length) clearInterval(t);
},50);
}

/* 🎆 FINAL SCENE */
function final(){

document.body.classList.add("shake");

/* CONFETTI */
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff4d6d","#fff","#ffd700","#ff69b4"][Math.floor(Math.random()*4)];
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);
}

/* GO CREDITS */
setTimeout(()=>{
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p7").classList.add("active");
},1200);

}

</script>

</body>
</html>
