<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
overflow:hidden;
}

/* PAGE SYSTEM */
.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.6s ease;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

/* BALLOONS */
.balloons{
font-size:40px;
animation:float 2s infinite;
}

@keyframes float{
0%{transform:translateY(20px);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-30px);opacity:0;}
}

/* BOX */
.box{
width:220px;
height:140px;
background:#ff4d6d;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

/* FLYING PAPER */
#paper{
position:fixed;
top:60%;
left:50%;
transform:translate(-50%,0);
background:white;
color:black;
padding:20px;
border-radius:12px;
max-width:300px;
opacity:0;
transition:1s;
}

/* PAPER ANIMATION */
.fly{
top:10% !important;
opacity:1 !important;
}

/* TOP MESSAGE */
#msg{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:10px;
max-width:80%;
display:none;
}

/* GAME */
.btn{
width:45px;
height:45px;
margin:5px;
border-radius:50%;
border:none;
background:white;
cursor:pointer;
}

/* PHOTOS */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:10px;
}

.gallery img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}

</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<div class="balloons">🎈🎈🎈🎈</div>
<h1>HAPPY BIRTHDAY MY LOVE ❤️</h1>

<button onclick="go(2)">Start</button>
</div>

<!-- PAGE 2 LETTER BOX -->
<div class="page" id="p2">

<h1>💌 Open Your Surprise</h1>

<div class="box" onclick="openBox()">
🎁 Happy Birthday Girl 💖<br>Click to Open
</div>

</div>

<!-- FLOATING PAPER -->
<div id="paper">
Hey beautiful ❤️<br><br>

Happy Birthday! Wishing you a peaceful and prosperous life ahead.<br><br>

You mean the world to me… I love you 💖
</div>

<!-- TOP MESSAGE -->
<div id="msg"></div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">

<h1>💖 What I Love Most</h1>

<div>
<button class="btn" onclick="show(1)">1</button>
<button class="btn" onclick="show(2)">2</button>
<button class="btn" onclick="show(3)">3</button>
<button class="btn" onclick="show(4)">4</button>
<button class="btn" onclick="show(5)">5</button>
<button class="btn" onclick="show(6)">6</button>
<button class="btn" onclick="show(7)">7</button>
<button class="btn" onclick="show(8)">8</button>
<button class="btn" onclick="show(9)">9</button>
<button class="btn" onclick="show(10)">10</button>
</div>

<p id="text"></p>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 PHOTOS -->
<div class="page" id="p4">

<h1>📸 Memories</h1>

<div class="gallery">

<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
<img src="happy.jpeg">
<img src="weird.JPG">
<img src="musa_1.jpg">
<img src="me.JPG">

</div>

</div>

<script>

function go(p){
document.querySelectorAll(".page").forEach(x=>{
x.classList.remove("active");
});
document.getElementById("p"+p).classList.add("active");
}

/* BOX CLICK → PAPER + MESSAGE */
function openBox(){

document.getElementById("paper").classList.add("fly");

setTimeout(()=>{
document.getElementById("msg").style.display="block";
document.getElementById("msg").innerHTML=
"💌 Hey beautiful ❤️ Happy Birthday! Wishing you peace, prosperity and happiness. I love you 💖";
},1200);

}

/* GAME */
let data=[
"Your eyes 👁️",
"Your smile 😊",
"Your heart 💖",
"Your kindness 🫶",
"Your support ❤️",
"Your loyalty 💛",
"Your strength 💪",
"Your honesty ✨",
"Your vibe 🌸",
"Everything about you 💖"
];

function show(n){
document.getElementById("text").innerHTML=data[n-1];
}

</script>

</body>
</html>
