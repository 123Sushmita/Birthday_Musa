<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
overflow:hidden;
}

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
pointer-events:none;
transition:0.6s;
padding:20px;
}

.active{
opacity:1;
pointer-events:auto;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

/* PAGE 1 BALLOONS */
.balloons{
font-size:40px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(20px); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-30px); opacity:0;}
}

/* LETTER BOX */
.box{
width:220px;
height:140px;
background:#ff4d6d;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
}

.paper{
display:none;
background:white;
color:black;
padding:20px;
border-radius:10px;
max-width:400px;
margin-top:20px;
}

/* GAME */
.btn{
padding:10px;
margin:5px;
border-radius:50%;
width:45px;
height:45px;
border:none;
background:white;
cursor:pointer;
}

/* PHOTOS */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:15px;
}

.gallery img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">

<div class="balloons">🎈🎈🎈🎈</div>
<h1>HAPPY BIRTHDAY MY LOVE ❤️</h1>

<button onclick="go(2)">Start</button>
</div>

<!-- PAGE 2 LETTER BOX -->
<div class="page" id="p2">

<h1>💌 Open Your Letter</h1>

<div class="box" onclick="openLetter()">
📩 Click to Open
</div>

<div class="paper" id="paper">
Hey beautiful ❤️<br><br>

Happy Birthday! Wishing you a peaceful and prosperous life ahead.<br><br>

You know what you are to me… I love you the most.<br><br>

Enjoy your special day with us hehe 💖
</div>

<button onclick="go(3)">Next ➜</button>
</div>

<!-- PAGE 3 GAME -->
<div class="page" id="p3">

<h1>💖 What I Love The Most</h1>

<div>
<button class="btn" onclick="show(1)">1</button>
<button class="btn" onclick="show(2)">2</button>
<button class="btn" onclick="show(3)">3</button>
<button class="btn" onclick="show(4)">4</button>
<button class="btn" onclick="show(5)">5</button>
<button class="btn" onclick="show(6)">6</button>
<button class="btn" onclick="show(7)">7</button>
<button class="btn" onclick="show(8)">8</button>
<button class="btn" onclick="show(9)">9</button>
<button class="btn" onclick="show(10)">10</button>
</div>

<p id="text"></p>

<button onclick="go(4)">Next ➜</button>
</div>

<!-- PAGE 4 PHOTOS -->
<div class="page" id="p4">

<h1>📸 Memories</h1>

<div class="gallery">

<img src="seeee.jpeg">
<img src="Bum.JPG">
<img src="weeeee.JPG">
<img src="us.jpeg">
<img src="Dai.jpg">
<img src="surab.JPEG">
<img src="Girls.jpeg">
<img src="bacchatoli.jpeg">
<img src="family.JPG">
<img src="happy.jpeg">
<img src="weird.JPG">
<img src="musa_1.jpg">
<img src="me.JPG">

</div>

</div>

<script>

function go(p){
document.querySelectorAll(".page").forEach(x=>{
x.classList.remove("active");
});
document.getElementById("p"+p).classList.add("active");
}

/* LETTER OPEN */
function openLetter(){
document.getElementById("paper").style.display="block";
}

/* GAME */
let data=[
"Your beautiful eyes 👁️",
"Your pure heart 💖",
"Your smile 😊",
"Your innocence 🌸",
"Your kindness 🫶",
"Your loyalty 💛",
"Your support ❤️",
"Your strength 💪",
"Your honesty ✨",
"Everything about you 💖"
];

function show(n){
document.getElementById("text").innerHTML=data[n-1];
}

</script>

</body>
</html>
